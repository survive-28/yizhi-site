<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — YIZHI Smart Care Technology</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .thanks{min-height:100vh;display:grid;place-items:center;background:var(--green-950);color:#fff;text-align:center;padding:40px var(--pad)}
  .thanks img{height:40px;margin:0 auto 34px}
  .thanks h1{color:#fff;font-size:clamp(2rem,4.6vw,3.2rem);margin-bottom:16px;letter-spacing:-.03em}
  .thanks p{color:rgba(255,255,255,.68);max-width:46ch;margin:0 auto 30px}
  .thanks .mark{width:56px;height:56px;margin:0 auto 26px;border-radius:50%;border:1px solid rgba(197,155,58,.5);display:grid;place-items:center;color:var(--gold)}
  .thanks .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="thanks">
  <div>
    <img src="assets/img/logo-reverse.svg" alt="YIZHI Smart Care Technology" data-zh-alt="颐智科技">
    <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1 data-zh="收到了。">Thank you.</h1>
    <p data-zh="我们已收到你的信息，会在一个工作日内回复。发布会临近时，你会收到确认邮件与直播链接。">We have your message and will reply within one business day. Closer to the launch you will receive a confirmation and the stream link.</p>
    <div class="links">
      <a class="btn btn--gold" href="index.html" data-zh="回到首页">Back to the site</a>
      <a class="btn btn--ghost" href="launch.html" data-zh="查看发布会议程">See the programme</a>
    </div>
  </div>
</div>
<script src="assets/js/site.js" defer></script>
</body>
</html>
