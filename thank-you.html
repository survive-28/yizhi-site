<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — YIZHI Smart Care Technology</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .thanks{min-height:100vh;display:grid;place-items:center;background:var(--green-950);color:#fff;text-align:center;padding:40px var(--pad);position:relative}
  .thanks .lang-bar{position:absolute;top:24px;right:var(--pad)}
  .thanks img{height:40px;margin:0 auto 34px}
  .thanks h1{color:#fff;font-size:clamp(2rem,4.6vw,3.2rem);margin-bottom:16px;letter-spacing:-.03em}
  .thanks p{color:rgba(255,255,255,.72);max-width:48ch;margin:0 auto 30px}
  .thanks .mark{width:56px;height:56px;margin:0 auto 26px;border-radius:50%;border:1px solid rgba(197,155,58,.5);display:grid;place-items:center;color:var(--gold)}
  .thanks .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="thanks">
  <div class="lang-bar">
    <div class="lang-switch" role="group" aria-label="Language selection" data-de-aria-label="Sprachauswahl" data-zh-aria-label="语言切换">
      <button class="lang-opt is-active" type="button" data-set-lang="en" aria-pressed="true">EN</button>
      <button class="lang-opt" type="button" data-set-lang="de" aria-pressed="false">DE</button>
      <button class="lang-opt" type="button" data-set-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
  <div>
    <img src="assets/img/logo-reverse.svg" alt="YIZHI Smart Care Technology" data-de-alt="YIZHI Smart Care Technology" data-zh-alt="颐智科技">
    <div class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1 data-de="Vielen Dank." data-zh="已收到您的信息。">Thank you.</h1>
    <p data-de="Wir haben Ihre Nachricht erhalten und melden uns innerhalb eines Werktags über unser @yizhi.com-Team. Für den Launch am 24. November (SA308 / Booth C9) senden wir Ihnen rechtzeitig eine Bestätigung." data-zh="我们已收到您的提交，对应的 @yizhi.com 团队会在一个工作日内与您联系；如您预约了 11 月 24 日发布会（SA308 / SA407 Booth C9），我们将及时发送参会确认。">We have your message and our @yizhi.com desk will reply within one business day. For the 24 November launch (SA308 / Booth C9), your confirmation will arrive shortly.</p>
    <div class="links">
      <a class="btn btn--gold" href="index.html" data-de="Zurück zur Startseite" data-zh="回到首页">Back to the site</a>
      <a class="btn btn--ghost" href="launch.html" data-de="Launch-Details ansehen" data-zh="查看发布会详情">See the launch details</a>
    </div>
  </div>
</div>
<script src="assets/js/site.js" defer></script>
</body>
</html>
