<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — YIZHI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css?v=20261118c">
<style>
  .nf{min-height:100vh;display:grid;place-items:center;background:var(--cream);text-align:center;padding:40px var(--pad);position:relative}
  .nf .lang-bar{position:absolute;top:24px;right:var(--pad)}
  .nf .lang-switch{border-color:var(--line);background:rgba(0,91,62,.05)}
  .nf .lang-opt{color:var(--muted)}
  .nf .lang-opt.is-active{background:var(--green-900);color:#fff}
  .nf b{font-size:clamp(4rem,12vw,9rem);line-height:1;color:var(--green-900);letter-spacing:-.05em;display:block}
  .nf h1{font-size:clamp(1.4rem,2.6vw,2rem);margin:10px 0 14px}
  .nf p{color:var(--muted);max-width:42ch;margin:0 auto 28px}
</style>
</head>
<body>
<div class="nf">
  <div class="lang-bar">
    <div class="lang-switch" role="group" aria-label="Language selection" data-de-aria-label="Sprachauswahl" data-zh-aria-label="语言切换">
      <button class="lang-opt is-active" type="button" data-set-lang="en" aria-pressed="true">EN</button>
      <button class="lang-opt" type="button" data-set-lang="de" aria-pressed="false">DE</button>
      <button class="lang-opt" type="button" data-set-lang="zh" aria-pressed="false">中文</button>
    </div>
  </div>
  <div>
    <b>404</b>
    <h1 data-de="Diese Seite liegt in keinem der sechs Fächer." data-zh="这一页不在六个药仓里。">This page is not in the pill box.</h1>
    <p data-de="Die aufgerufene Seite existiert nicht oder wurde verschoben." data-zh="您访问的页面不存在，或已经移动到新的位置。">The page you asked for does not exist, or has moved.</p>
    <a class="btn" href="index.html" data-de="Zurück zur Startseite" data-zh="回到首页">Back to the site</a>
  </div>
</div>
<script src="assets/js/site.js?v=20261118c" defer></script>
</body>
</html>
